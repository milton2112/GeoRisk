name: Release Gate

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

jobs:
  release-gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install verified secret scanner
        run: node scripts/setupSecretScanner.js

      - name: Scan source and full Git history
        id: security-scan
        run: node scripts/checkSecurity.js --history

      - name: Install
        run: npm ci

      - name: Audit all dependencies including browser export libraries
        run: npm run audit:dependencies

      - name: Install Chromium for critical browser E2E
        run: npx playwright install --with-deps chromium

      - name: Startup budget
        run: npm run check:startup-budget

      - name: Startup smoke
        run: npm run test:startup

      - name: Data language quality
        run: npm run test:data-language

      - name: Validate data
        run: npm run validate:data

      - name: Fast local gate parity
        run: npm run prepush:check

      - name: Conflict audit
        run: npm run audit:conflicts

      - name: Scheduled data audit report
        run: npm run audit:data

      - name: Full release check
        run: npm run release:check

      # release:check includes browser E2E, offline, visual, performance and data audits,
      # then cleans dist. Rebuild and validate the exact directory uploaded to Pages.
      - name: Rebuild validated public artifact
        run: npm run build:prod

      - name: Validate Pages artifact
        run: npm run check:pages-artifact

      - name: Upload public site only
        if: github.repository == 'milton2112/GeoRisk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/public

      - name: Upload reports
        if: always() && steps.security-scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: geo-risk-release-reports
          path: |
            reports/*.json
          if-no-files-found: ignore

  deploy-pages:
    needs: release-gate
    if: github.repository == 'milton2112/GeoRisk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public app and excluded paths
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/checkDeployment.js --url "$PAGES_URL"

  scheduled-data-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install verified secret scanner
        run: node scripts/setupSecretScanner.js

      - name: Scan source and full Git history
        id: security-scan
        run: node scripts/checkSecurity.js --history

      - name: Install
        run: npm ci

      - name: Audit all dependencies including browser export libraries
        run: npm run audit:dependencies

      - name: Install Chromium for performance audit
        run: npx playwright install --with-deps chromium

      - name: Rebuild generated data
        run: npm run build:data

      - name: Conflict audit
        run: npm run audit:conflicts

      - name: Data automation audit
        run: npm run audit:data

      - name: Startup measurement
        run: npm run measure:startup

      - name: Performance snapshot
        run: npm run performance:snapshot

      - name: Product doctor
        run: npm run audit:doctor

      - name: Release artifact audit
        run: npm run audit:release-artifacts

      - name: Feature health audit
        run: npm run audit:features

      - name: Release status
        run: npm run release:status

      - name: Upload scheduled audit
        if: always() && steps.security-scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: geo-risk-scheduled-data-audit
          path: |
            reports/*.json
          if-no-files-found: ignore
