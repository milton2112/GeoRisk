name: Release Gate

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'audit' || 'release' }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

jobs:
  critical-browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    env:
      GEORISK_E2E_SHARD: ${{ matrix.shard }}/2
    steps:
      - name: Record release start
        run: echo "GEORISK_RELEASE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install verified secret scanner
        run: node scripts/setupSecretScanner.js
      - name: Scan source and full Git history
        id: security-scan
        run: node scripts/checkSecurity.js --history
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Install Chromium new headless for critical browser E2E
        run: npx playwright install --with-deps --no-shell chromium
      - name: Build public site
        run: npm run build:prod
      - name: Run sequential critical shard
        run: node scripts/runCriticalShard.js
      - name: Upload critical checkpoint
        if: always() && steps.security-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-risk-critical-e2e-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: reports/critical-browser-e2e.json
          if-no-files-found: error
          retention-days: 7

  release-gate:
    needs: critical-browser
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEORISK_E2E_REPORTS_DIR: ${{ github.workspace }}/tmp/critical-shards
    steps:
      # A skipped required job counts as success in GitHub. Fail explicitly when a shard failed.
      - name: Require both successful critical shards
        env:
          CRITICAL_RESULT: ${{ needs['critical-browser'].result }}
        run: test "$CRITICAL_RESULT" = success
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install verified secret scanner
        run: node scripts/setupSecretScanner.js

      - name: Scan source and full Git history
        id: security-scan
        run: node scripts/checkSecurity.js --history

      - name: Install
        run: npm ci

      - name: Audit all dependencies including browser export libraries
        run: npm run audit:dependencies

      - name: Install Chromium new headless for critical browser E2E
        run: npx playwright install --with-deps --no-shell chromium

      - name: Startup budget
        run: npm run check:startup-budget

      - name: Startup smoke
        run: npm run test:startup

      - name: Data language quality
        run: npm run test:data-language

      - name: Validate data
        run: npm run validate:data

      - name: Fast local gate parity
        run: npm run prepush:check

      - name: Conflict audit
        run: npm run audit:conflicts

      - name: Scheduled data audit report
        run: npm run audit:data

      - name: Download current critical shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: geo-risk-critical-e2e-*-attempt-${{ github.run_attempt }}
          path: tmp/critical-shards
          merge-multiple: false
          digest-mismatch: error

      - name: Full release check
        run: npm run release:check

      # release:check includes browser E2E, offline, visual, performance and data audits,
      # then cleans dist. Rebuild and validate the exact directory uploaded to Pages.
      - name: Rebuild validated public artifact
        run: npm run build:prod

      - name: Validate Pages artifact
        run: npm run check:pages-artifact

      - name: Verify unchanged combined time budgets
        run: node scripts/checkCriticalBudget.js

      - name: Upload public site only
        if: github.repository == 'milton2112/GeoRisk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/public

      - name: Upload reports
        if: always() && steps.security-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-risk-release-reports
          path: |
            reports/*.json
          if-no-files-found: ignore

  deploy-pages:
    needs: release-gate
    if: github.repository == 'milton2112/GeoRisk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify public app and excluded paths
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/checkDeployment.js --url "$PAGES_URL"

  scheduled-data-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install verified secret scanner
        run: node scripts/setupSecretScanner.js

      - name: Scan source and full Git history
        id: security-scan
        run: node scripts/checkSecurity.js --history

      - name: Install
        run: npm ci

      - name: Audit all dependencies including browser export libraries
        run: npm run audit:dependencies

      - name: Install Chromium new headless for performance audit
        run: npx playwright install --with-deps --no-shell chromium

      - name: Rebuild generated data
        run: npm run build:data

      - name: Conflict audit
        run: npm run audit:conflicts

      - name: Data automation audit
        run: npm run audit:data

      - name: Startup measurement
        run: npm run measure:startup

      - name: Performance snapshot
        run: npm run performance:snapshot

      - name: Product doctor
        run: npm run audit:doctor

      - name: Release artifact audit
        run: npm run audit:release-artifacts

      - name: Feature health audit
        run: npm run audit:features

      - name: Release status
        run: npm run release:status

      - name: Upload scheduled audit
        if: always() && steps.security-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-risk-scheduled-data-audit
          path: |
            reports/*.json
          if-no-files-found: ignore
