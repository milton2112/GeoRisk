name: Map Diagnostic

permissions:
  contents: read

on:
  push:
    branches:
      - 'codex/diagnose-map/**'
  workflow_dispatch:
    inputs:
      profile:
        description: Map profile to diagnose
        type: choice
        default: mobile
        options: [mobile, desktop]

concurrency:
  group: map-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEORISK_DIAGNOSTIC_PROFILE: ${{ inputs.profile || 'mobile' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install verified secret scanner
        run: node scripts/setupSecretScanner.js
      - name: Scan source and full Git history
        id: security-scan
        run: node scripts/checkSecurity.js --history
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Install regular Chromium
        run: npx playwright install --with-deps --no-shell chromium
      - name: Build public site
        run: npm run build:prod
      - name: Bounded diagnostic
        run: node scripts/runMapDiagnostic.js
      - name: Upload diagnostic only
        if: always() && steps.security-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-risk-map-diagnostic-${{ github.run_attempt }}
          path: |
            reports/startup-profile.json
            reports/map-diagnostic-cpu.json
            reports/map-diagnostic-trace.json
          if-no-files-found: error
          retention-days: 7
